# Publishes the web UI (web/dist) to the gh-pages branch, which GitHub Pages serves at
# https://<owner>.github.io/<repo>/. Only the static UI is hosted there; the call server
# (Twilio + OpenAI) must run elsewhere and is configured in the app's Settings.
name: Deploy web UI to GitHub Pages

on:
  push:
    branches: [main, claude/ai-phone-assistant-mvp-kmdkvx]
    paths: ['web/**', 'shared/**', 'package-lock.json', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w web
      - name: Publish to gh-pages branch
        working-directory: web/dist
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
      - name: Summary
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"; repo="${GITHUB_REPOSITORY#*/}"
          echo "Published to the gh-pages branch → https://${owner}.github.io/${repo}/" >> "$GITHUB_STEP_SUMMARY"
          echo "If the site 404s, enable it once: Settings → Pages → Build and deployment → Deploy from a branch → gh-pages / (root)." >> "$GITHUB_STEP_SUMMARY"
